<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Trick</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2521"/>
      <stop offset="0.55" stop-color="#171412"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.52" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#f3b544" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#f3b544" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f3b544" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="0.28" stop-color="#f8c95f"/>
      <stop offset="0.62" stop-color="#eaa83a"/>
      <stop offset="1" stop-color="#b06d17"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8762e"/>
      <stop offset="0.5" stop-color="#7a4f17"/>
      <stop offset="1" stop-color="#4a2e0c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.55">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="0.58" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b4a0d"/>
      <stop offset="1" stop-color="#4b2a05"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.12" stop-color="#fff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frontClip"><rect x="-168" y="-232" width="336" height="464" rx="46"/></clipPath>
  </defs>

  <!-- squircle -->
  <rect x="64" y="64" width="896" height="896" rx="206" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="206" fill="url(#glow)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="204.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- back card -->
  <g transform="translate(430 488) rotate(-15)" filter="url(#soft)">
    <rect x="-150" y="-210" width="300" height="420" rx="42" fill="url(#bronze)"/>
    <rect x="-146" y="-206" width="292" height="412" rx="38" fill="none" stroke="#f6d48b" stroke-opacity="0.22" stroke-width="3"/>
    <rect x="-112" y="-172" width="224" height="344" rx="22" fill="none" stroke="#2c1a05" stroke-opacity="0.35" stroke-width="5"/>
  </g>

  <!-- front card -->
  <g transform="translate(560 540) rotate(9)" filter="url(#shadow)">
    <rect x="-168" y="-232" width="336" height="464" rx="46" fill="url(#gold)"/>
    <g clip-path="url(#frontClip)">
      <rect x="-420" y="-260" width="840" height="520" fill="url(#sheen)" transform="rotate(-24)"/>
    </g>
    <rect x="-164" y="-228" width="328" height="456" rx="42" fill="none" stroke="#fff6d6" stroke-opacity="0.55" stroke-width="4"/>
    <!-- corner pips: a "live" dot, like a card index -->
    <circle cx="-112" cy="-174" r="17" fill="url(#pip)"/>
    <circle cx="112" cy="174" r="17" fill="url(#pip)"/>
    <!-- play mark, engraved -->
    <path d="M -46 -84 L 92 0 L -46 84 Z" fill="url(#pip)" stroke="url(#pip)" stroke-width="34" stroke-linejoin="round"/>
    <path d="M -46 -84 L 92 0 L -46 84 Z" fill="none" stroke="#fff3c9" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round" transform="translate(2 4)"/>
  </g>
</svg>
